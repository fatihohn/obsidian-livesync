map $http_origin $cors_allow_origin {
    default "";
    "app://obsidian.md"          $http_origin;
    "capacitor://localhost"      $http_origin;
    ~^http://localhost(:[0-9]+)?$ $http_origin;
}

upstream couchdb {
    server couchdb:5984;
}

upstream livesync-plugin {
    server livesync-plugin:80;
}

server {
    listen 80;
    server_name obsidian-sync.crenology.com crenology.com;

    # Handle Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }

}

# HTTPS server with Let's Encrypt certificates
server {
    listen 443 ssl http2;
    server_name obsidian-sync.crenology.com crenology.com;

    ssl_certificate /etc/letsencrypt/live/crenology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crenology.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Allow large uploads and long-running requests
    client_max_body_size 0;               # disable size limit (use a fixed size if you prefer)
    client_body_timeout 3600s;
    send_timeout 3600s;

    # CouchDB proxy
    location / {
        proxy_pass http://couchdb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_request_buffering off;      # stream request body to CouchDB
        proxy_buffering off;              # stream responses (for long changes feed)
        proxy_read_timeout 3600s;         # allow long sync/attach uploads
        proxy_send_timeout 3600s;

        # Normalize upstream CORS (avoid duplicates) and expose a single allowed origin
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;

        add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'accept,authorization,content-type,origin,referer,if-match,if-none-match,content-length,x-requested-with' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '3600' always;
        add_header 'Vary' 'Origin' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'accept,authorization,content-type,origin,referer,if-match,if-none-match,content-length,x-requested-with' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '3600' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Plugin files (optional)
    location /plugin/ {
        proxy_pass http://livesync-plugin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
