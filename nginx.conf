upstream couchdb {
    server couchdb:5984;
}

upstream livesync-plugin {
    server livesync-plugin:80;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment if SSL is enabled)
    # return 301 https://$server_name$request_uri;

    # CouchDB proxy
    location / {
        proxy_pass http://couchdb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable CORS for Obsidian
        add_header 'Access-Control-Allow-Origin' 'app://obsidian.md' always;
        add_header 'Access-Control-Allow-Origin' 'capacitor://localhost' always;
        add_header 'Access-Control-Allow-Origin' 'http://localhost' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'accept,authorization,content-type,origin,referer,x-requested-with' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '3600' always;
        add_header 'Vary' 'Origin' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'app://obsidian.md' always;
            add_header 'Access-Control-Allow-Origin' 'capacitor://localhost' always;
            add_header 'Access-Control-Allow-Origin' 'http://localhost' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, HEAD, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'accept,authorization,content-type,origin,referer,x-requested-with' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '3600' always;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Plugin files (optional)
    location /plugin/ {
        proxy_pass http://livesync-plugin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

